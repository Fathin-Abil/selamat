<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selamat Ulang Tahun, Umi Tercinta!</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Quicksand:wght@400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0d0d1a;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Quicksand', sans-serif;
  }

  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--d) ease-in-out infinite alternate;
  }
  @keyframes twinkle {
    from { opacity: 0.1; transform: scale(0.8); }
    to { opacity: 0.9; transform: scale(1.2); }
  }

  .confetti-container {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  .confetti-piece {
    position: absolute;
    top: -20px;
    width: 8px;
    height: 14px;
    border-radius: 2px;
    animation: fall var(--fall-dur) linear infinite;
    animation-delay: var(--fall-delay);
    opacity: 0;
  }
  @keyframes fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  .card {
    position: relative;
    z-index: 5;
    background: linear-gradient(135deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 28px;
    padding: 56px 48px;
    max-width: 480px;
    width: 90%;
    text-align: center;
    backdrop-filter: blur(16px);
    box-shadow: 0 0 80px rgba(255,180,80,0.15), 0 0 160px rgba(255,100,150,0.08);
    animation: floatIn 1s cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  @keyframes floatIn {
    from { opacity: 0; transform: translateY(40px) scale(0.95); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .cake {
    font-size: 72px;
    display: block;
    animation: bounce 2s ease-in-out infinite, appear 1s ease both;
    margin-bottom: 24px;
    filter: drop-shadow(0 8px 24px rgba(255,200,100,0.5));
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  @keyframes appear {
    from { opacity: 0; transform: scale(0.5) rotate(-10deg); }
    to { opacity: 1; transform: scale(1) rotate(0); }
  }

  .label {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #ffb347;
    margin-bottom: 16px;
    animation: fadeUp 1s 0.3s both;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 38px;
    font-weight: 700;
    color: #fff;
    line-height: 1.2;
    margin-bottom: 8px;
    animation: fadeUp 1s 0.5s both;
  }
  h1 span {
    font-style: italic;
    background: linear-gradient(90deg, #ffb347, #ff6b9d, #c770f0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .divider {
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, #ffb347, #ff6b9d);
    margin: 24px auto;
    border-radius: 2px;
    animation: fadeUp 1s 0.7s both;
  }

  .message {
    font-size: 16px;
    line-height: 1.8;
    color: rgba(255,255,255,0.72);
    animation: fadeUp 1s 0.9s both;
    margin-bottom: 16px;
  }

  .footer-emoji {
    margin-top: 28px;
    font-size: 20px;
    animation: fadeUp 1s 1.1s both;
    opacity: 0.7;
    letter-spacing: 6px;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="confetti-container" id="confetti"></div>

<div class="card">
  <span class="cake">🎂</span>
  <div class="label">✦ Hari Spesialmu ✦</div>
  <h1>
    Selamat <span>Ulang Tahun</span>,<br>
    <span>Umi Tercinta!</span>
  </h1>
  <div class="divider"></div>
  <p class="message">
    Semoga umi selalu panajng umur! 🌟
  </p>
  <div class="footer-emoji">🎈 🥳 🎊 🎁 🌈</div>
</div>

<script>
  // Stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 80; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      left: ${Math.random()*100}%;
      top: ${Math.random()*100}%;
      width: ${size}px;
      height: ${size}px;
      --d: ${Math.random()*3+1.5}s;
      animation-delay: ${Math.random()*3}s;
    `;
    starsEl.appendChild(s);
  }

  // Auto-launch confetti on load
  const colors = ['#ffb347','#ff6b9d','#c770f0','#70d6ff','#a8ff78','#fff'];
  const container = document.getElementById('confetti');

  function launchConfetti() {
    container.innerHTML = '';
    for (let i = 0; i < 80; i++) {
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.cssText = `
        left: ${Math.random()*100}%;
        background: ${colors[Math.floor(Math.random()*colors.length)]};
        --fall-dur: ${Math.random()*2+2}s;
        --fall-delay: ${Math.random()*3}s;
        transform: rotate(${Math.random()*360}deg);
      `;
      container.appendChild(p);
    }
  }

  launchConfetti();
  // Re-launch every 6 seconds
  setInterval(launchConfetti, 6000);
</script>
</body>
</html>
